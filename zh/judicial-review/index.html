<section class=&quot;hero&quot;><div class=&quot;wrap&quot;><div class=&quot;eyebrow&quot;>联邦法院移民诉讼</div><h1>司法审查</h1><p>当移民或难民决定存在不合理之处、法律瑕疵或程序不公时，司法审查（Judicial Review）是向联邦法院申请审查该决定的法律途径。</p></div></section>
<section class=&quot;section&quot;><div class=&quot;wrap grid&quot;><div><div class=&quot;eyebrow&quot;>针对性的法庭审查</div><h2>并非重新申请或上诉</h2></div><div><p>司法审查并非对整个申请进行重新审理。法院会审查原决定与案件记录，判断决策者是否在法律授权范围内行事、是否通过有理有据、逻辑清晰的分析得出了合理结果，以及是否遵循了公正的程序。</p><p>法院通常不会直接裁决签证、许可或永久居留申请是否应当获批。如果司法审查胜诉，常规救济方式为撤销原决定，将案件发回重审，通常会交由另一位决策者重新处理。</p></div></div></section>
<section class=&quot;section white&quot;><div class=&quot;wrap&quot;><div class=&quot;eyebrow&quot;>常见申请理由</div><h2>法院可能审查的内容</h2><div class=&quot;cards&quot;><div class=&quot;card&quot;><h3>合理性</h3><p>裁决理由是否回应了核心证据与争议焦点，是否遵循了合理的分析逻辑，是否结合法律与案件记录对结果作出了充分论证。</p></div><div class=&quot;card&quot;><h3>程序公正</h3><p>申请人是否获得了有意义的回应机会，程序是否中立，是否依法送达了所需通知或程序公正函。</p></div><div class=&quot;card&quot;><h3>法律或管辖权错误</h3><p>决策者是否误解了适用法律、适用了错误的法律判断标准、超越职权范围或未行使法定管辖权。</p></div><div class=&quot;card&quot;><h3>证据的实质性处理</h3><p>重要证据是否被忽略或存在根本性误读。司法审查通常基于现有案件记录进行；新证据的提交受到严格限制，仅在特殊情况下允许。</p></div></div><div class=&quot;note&quot;><strong>以上为常见示例，并非完整列举。</strong> 适用法律、裁决内容、审理程序与完整案件记录可能衍生其他申请理由。每一个案件都需要单独的法律评估。</div></div></section>
<section class=&quot;section&quot;><div class=&quot;wrap&quot;><div class=&quot;eyebrow&quot;>法庭程序</div><h2>申请在联邦法院的推进流程</h2><div class=&quot;courtpath&quot;><div class=&quot;phase&quot;><h3>申请与 leave（开庭许可）阶段</h3><ul><li>在法定期限内提交并送达 leave（开庭许可）与司法审查申请。</li><li>若原决定未附书面理由，法院会要求仲裁庭或决策者提供书面理由。</li><li>申请人送达并提交申请记录，内含证据与书面法律论证。</li><li>被申请人可提交宣誓书与辩论备忘录，申请人可提交答辩意见。</li><li>联邦法院法官对书面 leave（开庭许可）申请进行审查。若 leave（开庭许可）申请被驳回，程序即告终止；驳回决定不可上诉。</li></ul></div><div class=&quot;phase&quot;><h3>如获得 leave（开庭许可）</h3><ul><li>法院确定司法审查听证日期，并就仲裁庭记录及其他补充材料作出指示。</li><li>双方完成所需的法庭程序，律师在听证会上进行口头辩论。</li><li>法院可驳回申请，或作出相应救济，通常为撤销原决定并将案件发回重新裁定。</li><li>案件也可能在最终听证前达成和解，但提前和解取决于个案情况，不能一概而论。</li></ul></div></div><div class=&quot;note&quot;><strong>严格的提交期限：</strong> 根据《移民与难民保护法》s. 72(2)(b) 条规定 <em>《移民和难民保护法》</em>加拿大境内发生的案件一般期限为15天，境外发生的案件一般期限为60天，自收到或知晓决定之日起计算。延期申请由法院酌情决定，不可理所当然地认为必然获批。</div><p class=&quot;official&quot;>可参见联邦法院 <a href=&quot;https://www.fct-cf.ca/Content/img/base/charts/HiRes/PDF/chart%204.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>官方流程图</a> 了解详细的提交顺序与规则。</p></div></section>
<section class=&quot;section white&quot;><div class=&quot;wrap grid&quot;><div><h2>可申请审查的决定</h2></div><div><p>司法审查可针对临时居留拒签、永久居留拒签、人道主义与同情类决定、入境禁令认定，以及移民与难民委员会的决定提出。正确的救济途径取决于具体决定，以及是否必须先穷尽法定上诉途径。</p><p>提起司法审查并不会自动中止遣返程序。若遣返即将执行，可能需要单独提起紧急暂缓遣返动议。</p><p>法院作出有利裁决，并不代表案件在重新审理后一定会获得批准。这体现了司法审查与上诉的重要区别。上诉机构有权重新审理案件实体问题、采纳进一步证据，在部分情况下可直接作出替代决定。而在司法审查中，联邦法院通常仅基于原决策者掌握的记录，审查决定的合法性、公正性与合理性，一般不会直接对移民申请本身作出裁决。</p><p>若原决定被撤销，案件通常会发回重新裁定。新的决策者必须依法公正地重新审理，但仍负责对申请进行评估，仍有可能在合法程序下作出否定决定。</p></div></div></section>
<section class=&quot;cta&quot;><div class=&quot;wrap&quot;><h2>评估移民决定</h2><p>请携带拒签信、裁决理由、送达日期与申请记录，以便我们及时评估救济途径与提交期限。</p><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>预约法律咨询</a></div></section></div><script>const heightObserver=new ResizeObserver(([{contentRect}])=>{window.parent.postMessage({action:'iframeHeightUpdated',height:contentRect.height,id:'jrPage'},'*')});heightObserver.observe(document.documentElement);</script></body></html>
