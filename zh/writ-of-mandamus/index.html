<section class=&quot;hero&quot;>
<div class=&quot;wrap&quot;>
<div class=&quot;eyebrow&quot;>联邦法院救济途径</div>
<h1>强制令</h1>
<p>强制令（Writ of Mandamus）申请是请求联邦法院责令公共机构履行法定职责的救济方式——例如，在移民事务遭到无理拖延时，要求官员作出决定。</p>
</div>
</section>
<section class=&quot;section&quot;>
<div class=&quot;wrap grid&quot;>
<div>
<div class=&quot;eyebrow&quot;>制度含义</div>
<h2>“我们责令履行”</h2>
</div>
<div>
<p>强制令是法院依裁量作出的命令，指示公职人员或公共机构履行法律规定的职责。它不会命令决策者批准申请；但在符合条件的案件中，它可以迫使相关机构采取行动并作出决定。</p>
<p>该救济属于特殊救济，结果取决于案件事实。单纯的拖延并不必然符合申请条件，也不存在固定的月数门槛，超过即当然可以申请强制令。</p>
</div>
</div>
</section>
<section class=&quot;section white&quot;>
<div class=&quot;wrap&quot;>
<div class=&quot;eyebrow&quot;>核心考量因素</div>
<h2>可考虑申请强制令的情形</h2>
<div class=&quot;cards&quot;>
<div class=&quot;card&quot;>
<h3>公共法定义务</h3>
<p>相关机构必须负有明确的作为义务，且申请人必须满足触发该义务的全部条件。</p>
</div>
<div class=&quot;card&quot;>
<h3>不合理拖延</h3>
<p>法院会考量程序的性质与复杂度、申请人是否导致拖延，以及相关机构是否给出了令人信服的、针对个案的合理解释。</p>
</div>
<div class=&quot;card&quot;>
<h3>事先催告</h3>
<p>申请人通常应先要求相关机构履行职责或作出决定，并给予其合理的回应时间。</p>
</div>
<div class=&quot;card&quot;>
<h3>酌定救济</h3>
<p>在决定是否发布命令前，法院还会考量是否存在充分替代方案、救济的实际价值、衡平法考量以及便利平衡原则。</p>
</div>
</div>
</div>
</section>
<section class=&quot;section&quot;>
<div class=&quot;wrap&quot;>
<div class=&quot;eyebrow&quot;>联邦法院典型判例</div>
<h2>法院如何评估拖延</h2>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>2026</div>
<h3>Alnuaimi v. Canada (Citizenship and Immigration), 2026 FC 647</h3>
<p>该案为一起海外配偶担保案件，拖延时长接近七年，法院最终签发了强制令。判决适用了 <em>Apotex</em> 案确立的标准与 <em>Conille</em> 案确立的拖延考量因素，法院认为，笼统声称正在进行长期安全检查，不足以充分解释本案卷宗所呈现的具体拖延情况。</p>
<a href=&quot;https://www.canlii.org/en/ca/fct/doc/2026/2026fc647/2026fc647.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>2026</div>
<h3>Benison v. Canada (Royal Canadian Mounted Police External Review Committee), 2026 FCA 53</h3>
<p>联邦上诉法院在该案中重申了 <em>Apotex</em> 案的分析框架，并明确指出：重大损害并非证明不合理拖延以申请强制令的独立前提。泛泛的资源不足与案件积压解释必须与实际卷宗相关联，对“插队”的担忧也不必然构成申请障碍。法院责令仲裁庭在六个月内完成未结审查。</p>
<a href=&quot;https://www.canlii.org/en/ca/fca/doc/2026/2026fca53/2026fca53.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>2023</div>
<h3>Chen v. Canada (Citizenship and Immigration), 2023 FC 885</h3>
<p>在这起学习许可拖延案中，法院审查了完整的程序记录，以及酌定救济的要件是否成立。该判决表明，判断拖延时长必须结合程序性质、拖延原因及其他强制令申请标准综合考量。</p>
<a href=&quot;https://www.canlii.org/en/ca/fct/doc/2023/2023fc885/2023fc885.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>2011</div>
<h3>Abdalla v. Canada (Citizenship and Immigration), 2011 FC 988</h3>
<p>该判决表明，存在其他可行途径——包括该案中的临时身份——可能成为不签发强制令的考量因素。替代方案是否充分，需结合具体案卷判断。</p>
<a href=&quot;https://www.canlii.org/en/ca/fct/doc/2011/2011fc988/2011fc988.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>1998</div>
<h3>Conille v. Canada (Minister of Citizenship and Immigration), 1998 CanLII 9097 (FC)</h3>
<p>
<em>Conille</em> 案确立了判断不合理拖延的经典语境分析框架：拖延时长是否超出程序性质的合理要求、申请人是否有责任、相关机构是否给出了令人满意的解释。</p>
<a href=&quot;https://www.canlii.org/en/ca/fct/doc/1998/1998canlii9097/1998canlii9097.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<div class=&quot;case&quot;>
<div class=&quot;date&quot;>1993</div>
<h3>Apotex Inc. v. Canada (Attorney General), 1993 CanLII 3004 (FCA)</h3>
<p>
<em>Apotex</em> 案至今仍是强制令的权威分析框架，涵盖以下要件：公共法定义务、申请人明确的履行请求权、任何裁量因素、充分替代方案、实际价值、衡平法障碍以及便利平衡。</p>
<a href=&quot;https://www.canlii.org/en/ca/fca/doc/1993/1993canlii3004/1993canlii3004.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>阅读判决原文</a>
</div>
<p>
<strong>重要提示：</strong> 上述判例仅用于说明法律原则，并不设定固定等待期，也不保证其他案件会获得相同结果。每个案件均取决于其证据、程序历史与现行法律。</p>
</div>
</section>
<section class=&quot;section white&quot;>
<div class=&quot;wrap&quot;>
<div class=&quot;eyebrow&quot;>强制令与移民审理拖延</div>
<h2>常见问题</h2>
<div class=&quot;faq&quot;>
<h3>等待多久可以考虑申请强制令？</h3>
<p>没有固定的等待时长。强制令是特殊救济，通常被视为最后救济手段。一般而言，当审理时间已显著且大幅超过IRCC公布的处理时长时，才更适合考虑申请强制令；短暂拖延通常不建议提起。</p>
<p>官方公布的处理时长是重要参考，但并非法定期限，超过该时长也不必然构成不合理拖延。评估需结合申请的完整历史，包括案件类型与复杂度、拖延的时长与原因、是否有部分拖延可归责于申请人、IRCC或其他机构已采取的措施，以及对拖延的解释是否具体且令人信服。</p>
</div>
<div class=&quot;faq&quot;>
<h3>提交申请前是否需要先联系IRCC？</h3>
<p>是的。申请强制令之前，申请人通常应先要求IRCC作出处理，并给予其合理的回应时间。这一点非常重要，因为强制令的法律判断标准包含“事先催告履行义务”以及“给予决策者合理履约时间”两项要件。</p>
<p>通过IRCC网络表单、状态查询、申请调档（GCMS notes）或通过国会议员问询，有助于明确申请状态，并留存此前为获得决定所作努力的记录。但没有适用于所有案件的固定查询次数或流程要求。</p>
<p>若已在认真考虑申请强制令，律师通常会先发送正式催告函，要求IRCC在合理期限内作出决定，之后再启动联邦法院诉讼程序。这给了IRCC解决拖延问题的最后机会，也有助于证明寻求法院干预是穷尽其他途径后的最终救济。</p>
</div>
<div class=&quot;faq&quot;>
<h3>如果安全或背景调查正在进行怎么办？</h3>
<p>安全检查可能与拖延的解释相关，但其存在本身不能直接认定拖延是否合理。法院会审查证据，以及相关解释是否与实际卷宗、拖延时长相匹配。</p>
<p>如果存在具体且持续的安全顾虑，更长的审理时间可能具有合理性。另一方面，若拖延已久，却仅以“正在进行安全检查”这类笼统表述回应，仍可能支持强制令申请，尤其是在几乎没有证据解释检查为何耗时如此之久的情况下。</p>
</div>
<div class=&quot;faq&quot;>
<h3>申请强制令会损害我的申请吗？</h3>
<p>通过合法司法程序主张权利，不会改变申请的法定审核标准。申请强制令并不免除申请人持续提供真实信息、配合要求、更新联系方式的义务。</p>
<p>强制令解决的是拖延问题，而非申请本身的实体问题。IRCC仍负责依据适用法律要求评估申请，并可继续推进法律要求的未完成审理工作。</p>
<p>但联邦法院诉讼应当以负责任的方式提起。法院已警告，不得就同一未决事项重复提起强制令诉讼，尤其是在先前程序未完成、已被驳回，且再次提交没有合理解释的情况下。在此类情形下，重复诉讼可能被认定为滥用程序，并可能产生费用制裁后果。</p>
</div>
<div class=&quot;faq&quot;>
<h3>联邦法院程序需要多长时间？</h3>
<p>很多强制令申请在需要举行联邦法院听证前就已得到解决。如果案件进入 leave（开庭许可）阶段，联邦法院程序会遵循相对固定的时间表推进。</p>
<p>一般而言，强制令申请如完整进行至听证，从提交申请到听证或结案通常约需 8 至 20 个月。不过，许多案件不会进入该阶段，因为在联邦法院程序进行期间，IRCC 可能会对相关移民申请采取处理行动。</p>
</div>
<div class=&quot;faq&quot;>
<h3>如果未获得 leave（开庭许可）怎么办？</h3>
<p>如果联邦法院驳回 leave（开庭许可）申请，强制令程序即告终止，也不会举行口头听证。leave（开庭许可）申请被驳回后不得上诉；但这并不决定相关移民申请的实体结果，该申请仍由 IRCC 继续处理并作出决定。</p>
<p>驳回 leave（开庭许可）申请也不意味着未来永远不能申请强制令。移民拖延是动态变化的。如果时间大幅推移、申请情况发生变化，或出现了关于拖延原因或历史的新信息，可以重新评估情况。</p>
<p>后续强制令申请不能简单重复之前未成功的程序。联邦法院已警告，在先前申请被驳回后，无合理解释再次提起强制令申请的，可能构成滥用程序，并导致费用制裁。</p>
</div>
</div>
</section>
