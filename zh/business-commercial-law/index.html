</style><style>@font-face{font-family:&quot;Source Han Sans CN&quot;;src:url(&quot;/assets/fonts/SourceHanSansCN-VF.otf.woff2&quot;) format(&quot;woff2&quot;);font-style:normal;font-weight:250 900;font-display:swap}body,body *{font-family:&quot;Source Han Sans CN&quot;,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif!important}</style></head><body><main><section class=&quot;hero&quot;><div class=&quot;wrap&quot;><h1>商业与公司法</h1><p class=&quot;lead&quot;>为安省企业经营、商业合同及企业收购与出售提供法律服务，协助客户审阅交易安排、识别风险，并准备尽职调查、交易及交割所需文件。</p><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>预约法律咨询</a></div></section><section class=&quot;section&quot;><div class=&quot;wrap split&quot;><h2>为商业决策提供法律支持</h2><div><p>CanWise Law 协助创业者、企业主及企业梳理商业安排中的法律问题。我们审阅拟议条款，说明相关风险，并通过文件明确各方约定的权利与责任。</p><p>无论是设立公司、协商合同，还是收购现有企业，我们都会先了解您的目标、时间安排及重点关切，再确定法律服务范围。您可使用中文或英文与我们沟通。</p></div></div></section><section class=&quot;section white&quot;><div class=&quot;wrap&quot;><div class=&quot;section-head&quot;><h2>商业与公司法律服务</h2></div><div class=&quot;grid&quot;><article class=&quot;service&quot;><h3>企业收购与出售</h3><p>就股权收购及资产买卖提供法律服务，涵盖前期协议、法律尽职调查、购买协议及交割安排。具体工作结合企业情况、交易结构及双方约定的服务范围确定。</p></article><article class=&quot;service&quot;><h3>商业合同</h3><p>起草、审阅及协商商业合同、服务与顾问协议、保密协议及商业租赁文件，解释主要义务、付款条件、终止条款及风险分配。</p></article><article class=&quot;service&quot;><h3>公司设立与所有权安排</h3><p>办理安省及联邦公司注册、商号登记、公司组织文件及合伙事务，并起草或审阅股东协议与合伙协议，明确所有权、决策方式及企业所有者之间的安排。</p></article><article class=&quot;service&quot;><h3>公司记录与变更</h3><p>协助准备公司记录册、年度决议、公司变更、章程修订及股权转让文件，并处理解散与清算相关事务，梳理拟议公司事项所需的文件与批准。</p></article></div></div></section><section class=&quot;section&quot;><div class=&quot;wrap split&quot;><h2>企业买卖中的法律工作</h2><ol class=&quot;stages&quot;><li><h3>前期沟通与主要条款</h3><p>准备或审阅保密协议（NDA）、收购意向书（LOI）及排他安排，说明在正式购买协议签署前，这些文件可能产生的义务。</p></li><li><h3>法律尽职调查</h3><p>根据交易确定审查范围，可包括公司记录、所有权资料、重要合同、商业租赁及相关法律事项。审查结果用于识别需要协商的问题、取得的同意及满足的交割条件。</p></li><li><h3>购买协议与谈判</h3><p>起草、审阅及协商股权购买协议或资产购买协议，处理交易标的、双方义务、陈述与保证、交割条件及法律风险分配。</p></li><li><h3>交割安排</h3><p>根据交易文件及委托范围，与交易各方和顾问协调交割法律文件、所需同意、公司批准及约定条件的完成。</p></li></ol></div></section></main><script>new ResizeObserver(([{contentRect}])=>window.parent.postMessage({action:&quot;iframeHeightUpdated&quot;,height:contentRect.height},&quot;*&quot;)).observe(document.body);</script></body></html>"></iframe></main><footer style="height:auto;padding-top:44px;padding-bottom:18px"><div class="footer-grid"><div><img src="../../assets/logo.svg" alt="CanWise Law"><p>以中文和英文提供清晰、务实的法律服务。</p></div><div><h3>导航</h3><a href="/zh/">首页</a><a href="/zh/about/">关于我们</a><a href="/zh/practice-areas/">业务领域</a><a href="/contact/">联系我们</a></div><div><h3>CanWise Law 办公室</h3><p style="margin:0">2 Bloor Street E., Suite 3500<br>Toronto, Ontario M4W 1A8</p><p style="margin:0"><a href="mailto:admin@canwiselaw.com">admin@canwiselaw.com</a></p></div></div><div class="legal">Copyright © 2026 CanWise Law Office — 版权所有。<br>本网站信息仅供一般参考，不构成法律意见。</div></footer><script src="../../assets/site.js"></script></body></html>
