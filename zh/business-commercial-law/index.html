	<body><main><section class=&quot;hero&quot;><div class=&quot;wrap&quot;><h1>商业与公司法</h1><p class=&quot;lead&quot;>针对安大略省的企业设立、股权架构、合同、交易及日常公司事务提供务实的法律咨询。</p><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>预约法律咨询</a></div></section><section class=&quot;intro&quot;><div class=&quot;wrap introgrid&quot;><div><div class=&quot;eyebrow&quot;>聚焦商业需求的法律咨询</div><h2>商业决策的法律框架</h2></div><div><p>CanWise Law协助创业者、企业主及各类企业梳理重要商业决策背后的法律架构。清晰的文件约定与周密的规划有助于明确权责、管控风险，减少可避免的纠纷。</p><p>我们的法律建议结合交易实际与企业经营现状量身定制，涵盖企业设立、股权安排、合同签订、资产买卖及日常公司维护等各个方面。必要时，我们会与会计师及其他专业顾问协同工作。</p></div></div></section><section class=&quot;services&quot;><div class=&quot;wrap&quot;><div class=&quot;services-head&quot;><div class=&quot;eyebrow&quot;>公司商事法律服务</div><h2>覆盖企业全生命周期的服务</h2></div><div class=&quot;grid&quot;><article class=&quot;card&quot;><h3>企业设立与治理</h3><ul><li>安大略省及联邦公司注册</li><li>企业名称登记</li><li>合伙企业设立</li><li>公司架构搭建</li><li>公司会议记录簿与年度决议</li></ul></article><article class=&quot;card&quot;><h3>股权与商事协议</h3><ul><li>股东协议</li><li>合伙协议</li><li>商事合同</li><li>服务与咨询协议</li><li>保密协议（NDA）</li></ul></article><article class=&quot;card&quot;><h3>商业交易</h3><ul><li>资产收购与出售</li><li>股份买卖</li><li>意向书</li><li>尽职调查支持</li><li>交割文件</li></ul></article><article class=&quot;card&quot;><h3>日常企业法务</h3><ul><li>公司变更与章程修订</li><li>股份转让</li><li>合同审查与谈判</li><li>公司法定档案维护</li><li>解散与清盘</li></ul></article></div></div></section><section class=&quot;approach&quot;><div class=&quot;wrap approachbox&quot;><div><div class=&quot;eyebrow&quot;>我们的服务理念</div><h2>贴合企业实际的务实法律建议</h2></div><p>法律咨询应当为明智的商业决策提供支持。我们会综合考虑您的商业目标、法律风险、成本与时间安排，以清晰易懂的语言解释可选方案，并起草适配案件情况的法律文件。如需税务、会计或其他专业领域的意见，我们会与相关专业顾问合作。</p></div></section><section class=&quot;cta&quot;><div class=&quot;wrap ctagrid&quot;><div><h2>咨询商事律师</h2><p>预约咨询，与我们讨论您的企业经营、交易或商事协议相关问题。</p></div><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_bl
