<section class=&quot;hero&quot;><div class=&quot;wrap&quot;><div class=&quot;eyebrow&quot;>移民诉讼与上诉</div><h1>移民上诉庭</h1><p>移民上诉庭（Immigration Appeal Division，IAD）审理家庭担保拒签、遣返令及永久居民居住义务相关的特定上诉案件。上诉权利、期限与可用救济方式取决于具体裁决与适用法律。</p></div></section>
<section class=&quot;section&quot;><div class=&quot;wrap grid&quot;><div><div class=&quot;eyebrow&quot;>基于案件实体的上诉</div><h2>证据、证词与法律论证</h2></div><div><p>IAD上诉与联邦法院司法复议不同。根据上诉类型不同，IAD可审查决定的正确性、程序公正性、更新的书面证据、证人证词，以及在法律允许的情况下考量人道主义与同情因素。</p><p>诉讼中由部长派代表应诉。一份严谨的上诉案卷应当直接回应拒签或遣返理由，整理佐证证据、安排证人出庭，并说明所有相关人道主义因素，包括受案件直接影响的儿童的最大利益。</p></div></div></section>
<section class=&quot;section white&quot;><div class=&quot;wrap&quot;><div class=&quot;eyebrow&quot;>上诉管辖范围</div><h2>IAD常见审理案件类型</h2><div class=&quot;cards&quot;><div class=&quot;card&quot;><h3>担保上诉</h3><p>加拿大公民或永久居民担保人可依据《移民与难民保护法》s. 63(1) 条，对部分被拒的家庭类申请提起上诉。 <em>《移民和难民保护法》</em>常见争议包括关系真实性、资格与可入境性问题。法定限制条款可能剥夺上诉权利。</p></div><div class=&quot;card&quot;><h3>遣返令上诉</h3><p>永久居民、受保护人士及部分永久居民签证持有者，可依据s. 63(2)或(3)条对遣返令提起上诉。IAD可准许或驳回上诉，在适当案件中可附条件暂缓执行遣返令。</p></div><div class=&quot;card&quot;><h3>居住义务上诉</h3><p>永久居民可依据s. 63(4)条对部分境外裁决提起上诉。案件可围绕实际居住天数、s. 28条规定的法定例外情形，以及人道主义与同情因素展开辩论。</p></div></div><div class=&quot;note&quot;><strong>并非所有被拒的移民决定都允许向IAD提起上诉。</strong> 临时签证、学习许可与工作许可拒签通常不具备IAD上诉权。s. 64条及其他条款的限制也可能适用，包括特定的入境禁令认定。提起上诉前需先评估管辖权。</div></div></section>
<section class=&quot;section white&quot;><div class=&quot;wrap grid&quot;><div><div class=&quot;eyebrow&quot;>期限与案件结果</div><h2>及时采取行动</h2></div><div><p>上诉期限较短，且因案件类别而异。担保与遣返令上诉通常需在30天内提起。针对境外居住义务裁决的上诉通常需在60天内提起。确切的起算日期与提交形式需根据决定书与现行IAD规则确认。</p><p>IAD可选择合适案件进入替代性争议解决（ADR）程序，这是一种相对非正式的流程，旨在无需完整听证即可解决上诉。案件并非自动进入该程序，未达成和解的案件将继续通过IAD正常流程审理。</p><p>上诉结果可能为准许或驳回。在部分遣返令案件中，IAD可附条件批准暂缓执行，后续再行复核。若担保上诉胜诉后案件退回IRCC，仍可能需要进一步的审理与可入境性审查。</p></div></div></section>
<section class=&quot;cta&quot;><div class=&quot;wrap&quot;><h2>咨询IAD上诉相关事宜</h2><p>请携带拒签或遣返决定书、收到日期及相关申请记录，以便我们评估管辖权、上诉期限与证据方案。</p><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>预约法律咨询</a></div></section></div><script>const heightObserver=new ResizeObserver(([{contentRect}])=>{window.parent.postMessage({action:'iframeHeightUpdated',height:contentRect.height,id:'iadPage'},'*')});heightObserver.observe(document.documentElement);</script></body></html>
