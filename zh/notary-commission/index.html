	<body><meta charset=&quot;utf-8&quot;><meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;><main class=&quot;wrap&quot;> <section class=&quot;hero&quot;><div class=&quot;eyebrow&quot;>CanWise Law</div><h1>公证及监誓服务</h1><p>提供英语及普通话服务，需提前预约。请在预约前发送您的文件，以便我们确认所需服务类型及特殊要求。</p></section> <section class=&quot;prices&quot;><article class=&quot;price&quot;><span class=&quot;pill&quot;>仅限现场办理 · 需提前预约</span><h2>公证服务</h2><div class=&quot;amount&quot;>$100 <small style=&quot;font-size:16px&quot;>每份文件</small></div><p>适用于需要安大略省公证人授权的文件。</p><div class=&quot;yes&quot;><span class=&quot;mark&quot;>✓</span><span>与原件核对无误的经核证副本</span></div><div class=&quot;yes&quot;><span class=&quot;mark&quot;>✓</span><span>明确要求公证的签名或文件</span></div><div class=&quot;no&quot;><span class=&quot;mark&quot;>×</span><span>安大略省律师协会目前不允许远程或线上公证</span></div><p class=&quot;note&quot;>请携带文件原件。需提前预约，本服务不接受无预约到访。</p></article><article class=&quot;price gold&quot;><span class=&quot;pill&quot;>可提供视频预约</span><h2>远程监誓</h2><div class=&quot;amount&quot;>$100 <small style=&quot;font-size:16px&quot;>每次监誓</small></div><p>适用于可通过微信视频或Zoom实时见证的合规文件。</p><div class=&quot;yes&quot;><span class=&quot;mark&quot;>✓</span><span>宣誓书与法定声明</span></div><div class=&quot;yes&quot;><span class=&quot;mark&quot;>✓</span><span>未成年学生的合格监护人或家长声明</span></div><div class=&quot;yes&quot;><span class=&quot;mark&quot;>✓</span><span>接收机构认可的远程监誓文件</span></div><p class=&quot;note&quot;>接收单位必须同意接受远程监誓文件。</p></article></section> <section class=&quot;section&quot;><h2>远程监誓5步流程</h2><p class=&quot;lead&quot;>安大略省法律允许通过视频会议对部分宣誓书与法定声明进行监誓。我们会在预约前确认文件是否符合要求。</p><div class=&quot;steps&quot;><article class=&quot;step&quot;><div class=&quot;num&quot;>步骤 01</div><h3>准备文件并发送邮件</h3><p>将填妥但未签名的文件，连同政府签发的带照片身份证件复印件，通过电子邮件发送至我所进行提前审核。 <strong>请勿提前签名。</strong></p></article><article class=&quot;step&quot;><div class=&quot;num&quot;>步骤 02</div><h3>选择签名方式</h3><p><strong>电子签名：</strong> 直接在iPad或电脑上签署PDF，同时使用另一部手机进行视频连线。<br><strong>手写签名：</strong> 打印文件，在律师见证下完成签名。<br><strong>办公政策：</strong> 远程监誓不接受DocuSign签署的文件。</p></article><article class=&quot;step&quot;><div class=&quot;num&quot;>步骤 03</div><h3>参会并验证身份</h3><p>通过微信视频或Zoom加入会议。在镜头前向律师出示您的政府签发带照片有效身份证件原件。全程保持摄像头开启，确认您的所在地与理解声明，进行宣誓或郑重声明，并在律师见证下签名。</p></article><article class=&quot;step&quot;><div class=&quot;num&quot;>步骤 04</div><h3>发送已签署文件</h3><p>立即将完整的扫描文件或电子签名PDF通过电子邮件发送至我所。签名后请勿进行任何修改。</p></article><article class=&quot;step&quot;><div class=&quot;num&quot;>步骤 05</div><h3>我们完成流程并回寄文件</h3><p>律师完成所需的远程监誓信息填写，通常会在预约结束后不久通过电子邮件发回最终签署版本。</p></article></div><div style=&quot;margin-top:24px;background:#eef5fb;border:1px solid #c9dff2;border-radius:14px;padding:22px 24px&quot;><div class=&quot;eyebrow&quot; style=&quot;margin-bottom:6px&quot;>常见IRCC表格示例</div><h3 style=&quot;font-family:Georgia,serif;font-size:23px;color:#253548;margin:0 0 10px&quot;>常用远程监誓的IRCC表格</h3><p style=&quot;color:#526174;margin:0 0 12px&quot;>根据我们的远程监誓实务经验，以下表格目前未出现IRCC不接受的情况：</p><ul style=&quot;margin:0;padding-left:22px;color:#39485b&quot;><li style=&quot;margin:8px 0&quot;><a href=&quot;https://ircc.canada.ca/english/pdf/kits/forms/IMM5646E.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:#155ca8;font-weight:bold&quot;>监护权声明（IMM 5646）</a> — 家长声明页与监护人声明页为两个独立的宣誓部分；如果分别需要宣誓，则总费用为$200</li><li style=&quot;margin:8px 0&quot;><a href=&quot;https://www.canada.ca/en/immigration-refugees-citizenship/services/application/application-forms-guides/imm5604.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:#155ca8;font-weight:bold&quot;>随同移民未成年人的非随行父母/监护人声明（IMM 5604）</a></li><li style=&quot;margin:8px 0&quot;><a href=&quot;https://www.canada.ca/en/immigration-refugees-citizenship/services/application/application-forms-guides/imm5409.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:#155ca8;font-weight:bold&quot;>同居伴侣法定声明（IMM 5409）</a></li></ul><p class=&quot;note&quot; style=&quot;margin:12px 0 0&quot;><strong>预约前请确认：</strong> 表格要求与接收规则可能发生变化，我们不保证远程监誓文件一定会被接受。</p></div><div class=&quot;alert&quot;><strong>重要提示：</strong> 远程监誓与公证是不同的法律程序。部分文件必须现场公证，我们会在预约前确认您的文件是否符合远程监誓条件。办理合规的远程监誓时，签名人与监誓人必须实时可视、可听并双向沟通；必须确认签名人的身份与签名；远程监誓记录必须载明双方所在地，并符合安大略省第431/20号法规要求。由于接收机构无义务必须接受远程监誓文件，请务必在预约前确认接收要求。</div></section><section class=&quot;section&quot;><div class=&quot;credential&quot; style=&quot;margin-top:0;background:#253548&quot;><div class=&quot;seal&quot;>A</div><div><div class=&quot;eyebrow&quot; style=&quot;color:#d6e9ff&quot;>加拿大境外使用文件</div><h2 style=&quot;text-align:left;color:#fff;margin:5px 0 10px&quot;>海牙认证与文件认证协助 · $500 起</h2><p>加拿大公共文件如拟在包括中国在内的境外使用，接收机构可能要求海牙认证或其他形式的文件认证。对于加入《海牙认证公约》的国家，海牙认证通常可替代领事认证。对于其他国家，可能还需要通过大使馆或领事馆办理额外认证。具体要求因文件、目的地与接收方而异，可能还需要翻译或其他配套流程。</p><p style=&quot;margin-top:10px&quot;>CanWise Law可审查文件用途，必要时就公证提供建议，并协助办理拟在中国及其他国家使用的文件的安大略省海牙认证或认证流程。费用$500起；政府费用、快递费、翻译费及第三方费用需另行支付。请将文件、目的地国家及接收机构的要求发送给我们，以便评估。</p></div></div><div class=&quot;alert&quot;><strong>请注意：</strong> 海牙认证或认证证书确认的是公共文件上的签名、身份和印章。它并不证明文件内容的真实性，也不保证外国法院、政府机构、学校、银行或其他接收方会接受该文件。客户应向目标接收方确认目的地国家当前的认证、翻译及证据要求。</div></section><section class=&quot;section&quot;><h2>加拿大与中国：不同的公证制度</h2><p class=&quot;lead&quot;>加拿大的公证行为并不自动等同于中国的公证书。</p><div class=&quot;country&quot;><div><h3>加拿大及同类普通法司法管辖区</h3><p>公证人通常验证签名，或证明副本与出示的原件相符。这通常不代表公证人已调查文件中的所有基础事实。</p></div><div><h3>中国</h3><p>公证机构可对证明材料进行审查，并出具关于法律行为、事实或文件的正式公证书。在中国使用的加拿大文件可能还需要翻译、海牙认证或其他流程。</p></div></div></section><section class=&quot;credential&quot;><div class=&quot;seal&quot;>§</div><div><h2>法律与公证权限一站式服务</h2><p>Lola Hui Ding是安大略省执业律师与公证人，具备宣誓书与声明文件的监誓资质。服务可使用英语及普通话。</p></div></section> <section class=&quot;cta&quot;><h2>文件已准备好？</h2><p>预约前请先发送文件供审核。我们会确认您需要办理的是公证、监誓还是其他手续。</p><a class=&quot;btn&quot; href=&quot;https://calendly.com/hding-canwiselaw/legal-consultation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>申请预约</a></section> </main>
